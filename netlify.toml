# Netlify: publish only the page (dist/, built from public/ and shared/), and run
# GET /api/report as a function. Without this, Netlify serves the repository root
# as static files — no index.html there, so "/" is a 404, and every file in the
# repo is downloadable.
#
# Set in Site configuration → Environment variables (never in this file):
#   REPORT_API_KEY        the ceustamps-api Web App's CEU_ADMIN_KEY (required)
#   REPORT_ALLOWED_IPS    addresses that open the report with no sign-in, comma-separated
#   REPORT_AUTH_USER      optional sign-in name for everyone else
#   REPORT_AUTH_PASSWORD  optional sign-in password for everyone else (long and random)
#   REPORT_API_URL        optional; defaults to https://ceustamps-api.azurewebsites.net
# At least one of REPORT_ALLOWED_IPS or the sign-in pair must be set, or the
# function refuses to return any data.

[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
